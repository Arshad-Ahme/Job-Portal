{% extends 'base.html' %}
{% load crispy_forms_tags %}
 
{% block title %}Sign up - JobPortal{% endblock %}
 
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="text-center mb-4">Create your account</h3>
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary w-100 mt-2">Sign up</button>
        </form>
        <p class="text-center mt-3 mb-0">
          Already have an account? <a href="{% url 'login' %}">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
 
<script>
  const companyBox = document.getElementById('div_id_company_name');
  const roleInputs = document.querySelectorAll('input[name="role"]');
 
  function toggleCompany() {
    const selected = document.querySelector('input[name="role"]:checked');
    companyBox.style.display =
      selected && selected.value === 'recruiter' ? '' : 'none';
  }
 
  roleInputs.forEach(r => r.addEventListener('change', toggleCompany));
  toggleCompany();
</script>
{% endblock %}
