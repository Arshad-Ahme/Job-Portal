{% extends 'base.html' %}
 
{% block title %}Check your email - JobPortal{% endblock %}
 
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="card shadow-sm text-center">
      <div class="card-body p-4">
        <i class="bi bi-envelope-check fs-1 text-primary"></i>
        <h3 class="mt-3">Check your email</h3>
        <p class="text-muted">
          If an account exists for that email address, we've sent instructions
          for setting a new password.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
