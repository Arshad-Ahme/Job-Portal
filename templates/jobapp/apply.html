{% extends 'base.html' %}
{% load crispy_forms_tags %}
 
{% block title %}Apply - {{ job.title }}{% endblock %}
 
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-1">Apply for {{ job.title }}</h3>
        <p class="text-muted mb-4">{{ job.company_name }} &middot; {{ job.location }}</p>
        <form method="post" enctype="multipart/form-data" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">Submit application</button>
            <a href="{% url 'job_detail' job.pk %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
